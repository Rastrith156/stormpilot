<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>StormPilot Fleet Operations</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <strong>StormPilot</strong>
          <small>Drone ops</small>
        </div>
      </div>
      <nav>
        <a class="nav-item active" href="/ui">Operations</a>
        <a class="nav-item" href="/drone/connect">Drone connect</a>
        <a class="nav-item" href="/metrics">Metrics</a>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Live demo</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">OPERATIONS / FLEET</p>
          <h1>Delivery dashboard</h1>
        </div>
        <div class="top-actions">
          <a class="button secondary" href="/drone/connect">Connect phone</a>
          <button id="refreshButton" class="button primary" type="button">Refresh</button>
        </div>
      </header>

      <section class="stats-grid" id="statsGrid"></section>

      <section class="panel map-panel">
        <div class="panel-header">
          <h2>Live map</h2>
          <span id="mapStatus" class="pill warning">Demo mode</span>
        </div>
        <div id="map" aria-label="Google map of drone fleet"></div>
      </section>

      <section class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>Drone fleet</h2>
            <span id="fleetCount" class="pill">0</span>
          </div>
          <div id="fleetList" class="fleet-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Delivery activity</h2>
            <span class="pill neutral">Ops feed</span>
          </div>
          <div id="deliveryList" class="delivery-list"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
