apiVersion: v1
kind: Namespace
metadata:
  name: stormpilot-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stormpilot
  namespace: stormpilot-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: stormpilot}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: stormpilot}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: stormpilot:local
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENPROJECT_URL
              value: ""
            - name: OPENPROJECT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openproject-credentials
                  key: api-token
                  optional: true
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stormpilot
  namespace: stormpilot-lab
spec:
  selector: {app: stormpilot}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stormpilot
  namespace: stormpilot-lab
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: stormpilot}
