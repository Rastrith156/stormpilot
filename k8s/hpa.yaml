apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stormpilot
  namespace: stormpilot-lab
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: stormpilot}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
